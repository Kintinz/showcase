name: Publish showcase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showcase-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check application
        run: node scripts/check.mjs
      - name: Restore preview packages
        id: preview-cache
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/preview-cache
          key: showcase-preview-${{ runner.os }}-node24-${{ hashFiles('scripts/build-showcase.ts', 'scripts/preview-cache.mjs', 'worker/src/package.ts', 'worker/src/errors.ts') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            showcase-preview-${{ runner.os }}-node24-${{ hashFiles('scripts/build-showcase.ts', 'scripts/preview-cache.mjs', 'worker/src/package.ts', 'worker/src/errors.ts') }}-
      - name: Build static showcase
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-showcase.ts --cache
      - name: Upload capacity report
        if: ${{ !cancelled() && steps.build.outputs.report-path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: showcase-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.report-path }}
          if-no-files-found: error
      - name: Save preview packages
        if: success() && github.ref == 'refs/heads/main' && steps.build.outputs.cache-save == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/preview-cache
          key: showcase-preview-${{ runner.os }}-node24-${{ hashFiles('scripts/build-showcase.ts', 'scripts/preview-cache.mjs', 'worker/src/package.ts', 'worker/src/errors.ts') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
